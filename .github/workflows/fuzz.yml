name: Fuzz

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/rules/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-rules:
    name: Fuzz txwatch-rules (60s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz from_horizon for 60 seconds
        working-directory: crates/rules
        run: cargo fuzz run from_horizon -- -max_total_time=60
