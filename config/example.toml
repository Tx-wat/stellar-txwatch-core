poll_interval_seconds = 10

# Optional: global webhook retry policy (defaults shown)
# [webhook_retry]
# max_retries  = 3   # 1–10
# backoff_base = 2   # seconds; attempt N waits backoff_base^N seconds

[[contracts]]
label       = "My Escrow Contract"
# Replace with your actual Soroban contract address (56 characters, starts with 'C')
contract_id = "CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
network     = "testnet"
webhook_url = "https://hooks.example.com/my-webhook"
# webhook_url = "${SLACK_WEBHOOK_URL}"   # env var interpolation supported
# webhook_urls = [                       # multiple endpoints for fan-out
#   "https://hooks.slack.com/...",
#   "https://events.pagerduty.com/...",
# ]
# webhook_secret = "${MY_SECRET}"        # optional HMAC-SHA256 secret
# enabled = false                        # set to false to skip polling without removing
# webhook_max_retries = 2               # per-contract retry override (1–10)

  [[contracts.rules]]
  type          = "LargeTransfer"
  threshold_xlm = 10000

  [[contracts.rules]]
  type           = "AdminFunctionCalled"
  function_names = ["set_admin", "upgrade", "initialize"]

  [[contracts.rules]]
  type = "TransactionFailed"

[[contracts]]
label       = "Mainnet Vault"
# Replace with your actual Soroban contract address (56 characters, starts with 'C')
contract_id = "CBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB"
network     = "mainnet"
webhook_url = "https://hooks.example.com/vault-webhook"

  [[contracts.rules]]
  type = "AnyTransaction"

  [[contracts.rules]]
  type          = "FunctionCalled"
  function_name = "withdraw"

[[contracts]]
label       = "Mainnet Bridge Gateway"
# Replace with your actual Soroban contract address (56 characters, starts with 'C')
contract_id = "CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC"
network     = "mainnet"
webhook_url = "https://hooks.example.com/bridge-webhook"

  [[contracts.rules]]
  type              = "HighFee"
  threshold_stroops = 100000

  [[contracts.rules]]
  type = "TransactionFailed"
