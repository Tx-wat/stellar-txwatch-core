poll_interval_seconds = 10

[[contracts]]
label       = "My Escrow Contract"
# Replace with your actual Soroban contract address (56 characters, starts with 'C')
contract_id = "CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
network     = "testnet"
webhook_url = "https://hooks.example.com/my-webhook"
# webhook_secret = "my-secret-token"   # optional: HMAC-SHA256 signature sent as X-TxWatch-Signature header

  [[contracts.rules]]
  type          = "LargeTransfer"
  threshold_xlm = 10000

  [[contracts.rules]]
  type           = "AdminFunctionCalled"
  function_names = ["set_admin", "upgrade", "initialize"]

  [[contracts.rules]]
  type = "TransactionFailed"

[[contracts]]
label       = "Mainnet Vault"
# Replace with your actual Soroban contract address (56 characters, starts with 'C')
contract_id = "CBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB"
network     = "mainnet"
webhook_url = "https://hooks.example.com/vault-webhook"

  [[contracts.rules]]
  type = "AnyTransaction"

  [[contracts.rules]]
  type          = "FunctionCalled"
  function_name = "withdraw"

# Each [[contracts]] block is independent: rules, webhook_url, and network settings
# apply only to that contract. You can define different webhook receivers and alert
# rules per contract, even if they share the same network.
# Example: HighFee rule (threshold in stroops)
#  [[contracts.rules]]
#  type               = "HighFee"
#  threshold_stroops  = 100000
[[contracts]]
label       = "Mainnet Bridge Gateway"
# Replace with your actual Soroban contract address (56 characters, starts with 'C')
contract_id = "CDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD"
# network must be one of: mainnet / testnet / futurenet
network     = "mainnet"
# webhook_url can differ per contract — this allows routing alerts to different endpoints
webhook_url = "https://hooks.example.com/bridge-webhook"
# webhook_secret = "another-secret-token"

  [[contracts.rules]]
  type          = "HighFee"
  threshold_stroops = 100000

  [[contracts.rules]]
  type = "TransactionFailed"

# ---------------------------------------------------------------------------
# Common configuration errors
# ---------------------------------------------------------------------------
# The examples below show frequent TOML parse/validation errors and their fixes.
#
# 1) Wrong section nesting for rules
#    Wrong:  [contracts.rules]        (single brackets create a table, not an array)
#    Error:  TOML parse error: invalid type: map, expected a sequence
#            (or: expected a sequence for `contracts.rules`)
#    Fix:    use double brackets so each rule is an array element:
#              [[contracts.rules]]
#              type = "TransactionFailed"
#
# 2) Invalid network value
#    Wrong:  network = "main"
#    Error:  invalid network "main": expected one of mainnet, testnet, futurenet
#    Fix:    network = "mainnet"   # allowed: mainnet / testnet / futurenet
#
# 3) Duplicate contract labels
#    Wrong:  two [[contracts]] blocks both with label = "Mainnet Vault"
#    Error:  duplicate contract label "Mainnet Vault"
#    Fix:    give every contract a unique label, e.g. "Mainnet Vault" and
#            "Mainnet Vault Backup"
#
# 4) Missing required fields
#    Wrong:  [[contracts]]
#            label = "No Address"
#            network = "testnet"
#    Error:  missing field `contract_id`
#    Fix:    include all required fields for each contract:
#              [[contracts]]
#              label       = "My Contract"
#              contract_id = "C..."   # 56 chars, starts with 'C'
#              network     = "testnet"
#              webhook_url = "https://hooks.example.com/my-webhook"
