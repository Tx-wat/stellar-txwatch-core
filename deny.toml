# cargo-deny configuration: advisory, license, ban, and source policy.
# Run locally with `cargo deny check` (see CONTRIBUTING.md).

[graph]
all-features = true

[advisories]
# Known vulnerabilities (RustSec) always fail the check.
unmaintained = "workspace"
yanked       = "deny"
ignore       = []

[licenses]
# Only licenses on this allow-list pass; anything else fails the check.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards         = "deny"
# Path dependencies between workspace crates have no version requirement.
allow-wildcard-paths = true
deny              = []
skip              = []
skip-tree         = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
