# cargo-deny configuration
# This file specifies security and dependency policies for the project.
# Checked in CI by the `deny` job in .github/workflows/ci.yml (`cargo deny check`).

[advisories]
# How to handle crates with security vulnerabilities (always an error; not configurable).
# How to handle unmaintained crates: "all", "workspace", "transitive" or "none".
unmaintained = "workspace"
# A list of advisory IDs to ignore. Each entry needs a justification comment.
ignore = [
    #"RUSTSEC-2020-0001",
]

[licenses]
# List of explicitly allowed licenses. Anything not listed (including GPL-2.0,
# GPL-3.0 and AGPL-3.0) is rejected. Unlicensed crates are always rejected.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "MPL-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
]
# The confidence threshold for detecting a license from license text.
confidence-threshold = 0.8

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for wildcard version requirements
wildcards = "warn"
# A list of explicitly disallowed crates
deny = [
    # Each entry can be just the name and version like:
    # { name = "ansi_term", version = "=0.11.0" },
]
# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
    #{ name = "ansi_term", version = "=0.11.0" },
]
# Similarly named crates that are allowed to coexist
skip-tree = [
    #{ name = "windows-sys", version = "=0.48.0" },
]

[sources]
# Lint level for what to happen when a crate from a crate registry that is not in the allow list is detected
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is not in the allow list is detected
unknown-git = "warn"
# List of allowed crate registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# List of allowed Git repositories
allow-git = []
