version: '3.8'

services:
  txwatch:
    build: .
    container_name: txwatch-dev
    volumes:
      - ./config/example.toml:/config.toml
      - ./config/docker-compose.toml:/config.docker-compose.toml
    environment:
      RUST_LOG: debug
    command: --config /config.docker-compose.toml watch
    healthcheck:
      test: ["CMD", "txwatch", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - webhook-receiver
    networks:
      - txwatch

  webhook-receiver:
    image: node:20-alpine
    container_name: webhook-receiver
    working_dir: /app
    volumes:
      - ./examples/webhook-receiver:/app
    command: node receiver.js
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    networks:
      - txwatch

networks:
  txwatch:
    driver: bridge