[package]
name    = "txwatch-notifier"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish   = false

[dependencies]
txwatch-config = { path = "../config" }
txwatch-rules = { path = "../rules" }
reqwest       = { workspace = true, features = ["native-tls"] }
serde_json    = { workspace = true }
anyhow        = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
chrono        = { workspace = true }
hmac          = { workspace = true }
sha2          = { workspace = true }
hex           = { workspace = true }

[dev-dependencies]
wiremock      = "0.6"
tokio         = { workspace = true }
tracing-subscriber = { workspace = true }
rcgen         = "0.13"
tokio-rustls  = "0.26"
hyper         = { version = "1", features = ["server", "http1"] }
hyper-util    = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rustls-pemfile = "2"
hmac          = { workspace = true }
sha2          = { workspace = true }
hex           = { workspace = true }
