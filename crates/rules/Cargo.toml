[package]
name = "txwatch-rules"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
txwatch-config = { path = "../config" }

[dev-dependencies]
proptest = "1"
