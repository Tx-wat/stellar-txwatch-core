[package]
name    = "txwatch"
version = "0.1.0"
edition = "2021"
license   = "Apache-2.0"
publish   = false

[[bin]]
name = "txwatch"
path = "src/main.rs"

[dependencies]
txwatch-config   = { path = "../config" }
txwatch-poller   = { path = "../poller" }
txwatch-notifier = { path = "../notifier" }
clap             = { workspace = true }
tokio            = { workspace = true }
anyhow           = { workspace = true }
reqwest          = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry        = { version = "0.33", optional = true }
opentelemetry_sdk    = { version = "0.33", optional = true }
opentelemetry-otlp   = { version = "0.33", default-features = false, features = ["trace", "grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }

[features]
# Opt-in OTLP trace export. Off by default so the default build has no extra dependencies.
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
