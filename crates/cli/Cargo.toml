[package]
name    = "txwatch"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish   = false

[[bin]]
name = "txwatch"
path = "src/main.rs"

[[example]]
name = "minimal"
path = "../../examples/minimal.rs"

[features]
# Forwards to the poller's Prometheus metrics (also counts failed config reloads).
metrics = ["txwatch-poller/metrics"]

[dependencies]
txwatch-config   = { path = "../config" }
txwatch-poller   = { path = "../poller" }
txwatch-notifier = { path = "../notifier" }
clap             = { workspace = true }
tokio            = { workspace = true }
anyhow           = { workspace = true }
reqwest          = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
serde            = { workspace = true, features = ["derive"] }
serde_json       = { workspace = true }
notify           = "6"

[dev-dependencies]
hmac               = { workspace = true }
sha2               = { workspace = true }
hex                = { workspace = true }
assert_cmd         = "2"