[package]
name    = "txwatch"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
license   = "Apache-2.0"
publish   = false

[[bin]]
name = "txwatch"
path = "src/main.rs"

[dependencies]
txwatch-config   = { path = "../config" }
txwatch-poller   = { path = "../poller" }
txwatch-notifier = { path = "../notifier" }
